version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Tallinn"
    open-pull-requests-limit: 5
    groups:
      android-gradle:
        patterns:
          - "com.android.application"
          - "com.android.*"
          - "gradle*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      androidx:
        patterns:
          - "androidx.*"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Europe/Tallinn"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
