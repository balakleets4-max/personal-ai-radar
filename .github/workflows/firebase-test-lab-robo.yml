name: Firebase Test Lab Robo

on:
  workflow_dispatch:

concurrency:
  group: firebase-test-lab-robo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robo-test:
    name: Build and run Robo test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          else
            echo "GOOGLE_SERVICES_JSON secret is not set"
            exit 1
          fi

      - name: Validate Firebase Test Lab secrets
        env:
          FIREBASE_TEST_LAB_PROJECT_ID: ${{ secrets.FIREBASE_TEST_LAB_PROJECT_ID }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          if [ -z "$FIREBASE_TEST_LAB_PROJECT_ID" ]; then
            echo "FIREBASE_TEST_LAB_PROJECT_ID secret is not set"
            exit 1
          fi
          if [ -z "$GCP_CREDENTIALS" ]; then
            echo "GCP_CREDENTIALS secret is not set"
            exit 1
          fi

      - name: Build debug APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: gradle -Pandroid.useAndroidX=true -Pandroid.nonTransitiveRClass=true assembleDebug --stacktrace

      - name: Locate APK
        run: |
          APK_PATH="$(find build/outputs/apk/debug -name '*debug*.apk' ! -name '*androidTest*' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "Debug APK not found"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "Using APK: $APK_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-radar-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          project_id: ${{ secrets.FIREBASE_TEST_LAB_PROJECT_ID }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Force Google Cloud project
        env:
          FIREBASE_TEST_LAB_PROJECT_ID: ${{ secrets.FIREBASE_TEST_LAB_PROJECT_ID }}
        run: |
          unset CLOUDSDK_CORE_PROJECT CLOUDSDK_PROJECT GCLOUD_PROJECT GCP_PROJECT GOOGLE_CLOUD_PROJECT
          gcloud --quiet config set project "$FIREBASE_TEST_LAB_PROJECT_ID"
          echo "CLOUDSDK_CORE_PROJECT=$FIREBASE_TEST_LAB_PROJECT_ID" >> "$GITHUB_ENV"
          echo "CLOUDSDK_PROJECT=$FIREBASE_TEST_LAB_PROJECT_ID" >> "$GITHUB_ENV"
          echo "GCLOUD_PROJECT=$FIREBASE_TEST_LAB_PROJECT_ID" >> "$GITHUB_ENV"
          echo "GCP_PROJECT=$FIREBASE_TEST_LAB_PROJECT_ID" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=$FIREBASE_TEST_LAB_PROJECT_ID" >> "$GITHUB_ENV"
          gcloud auth list --filter=status:ACTIVE --format="value(account)" | sed 's/@.*$/@***/'

      - name: Select Firebase Test Lab device
        env:
          FIREBASE_TEST_LAB_PROJECT_ID: ${{ secrets.FIREBASE_TEST_LAB_PROJECT_ID }}
        run: |
          mkdir -p test-results/firebase-test-lab
          gcloud --quiet config set project "$FIREBASE_TEST_LAB_PROJECT_ID"
          gcloud --quiet firebase test android models list --format=json > test-results/firebase-test-lab/models.json
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          models_path = Path("test-results/firebase-test-lab/models.json")
          models = json.loads(models_path.read_text(encoding="utf-8"))

          def model_id(model):
              return str(model.get("id") or model.get("modelId") or "")

          def model_form(model):
              return str(model.get("form") or "").upper()

          def model_versions(model):
              versions = model.get("supportedVersionIds") or model.get("supportedVersionIds[]") or []
              return [str(version) for version in versions]

          preferred_versions = ["35", "34", "33", "32", "31", "30", "29", "28", "27", "26"]
          preferred_model_ids = [
              "MediumPhone.arm",
              "MediumPhone",
              "SmallPhone.arm",
              "SmallPhone",
              "Pixel2",
              "NexusLowRes",
          ]

          virtual_models = [model for model in models if "VIRTUAL" in model_form(model)]
          candidates = virtual_models or models

          selected = None
          selected_version = None

          for preferred_id in preferred_model_ids:
              for model in candidates:
                  if model_id(model) == preferred_id:
                      versions = model_versions(model)
                      for version in preferred_versions:
                          if version in versions:
                              selected = model
                              selected_version = version
                              break
                      if selected:
                          break
              if selected:
                  break

          if not selected:
              for model in candidates:
                  versions = model_versions(model)
                  for version in preferred_versions:
                      if version in versions:
                          selected = model
                          selected_version = version
                          break
                  if selected:
                      break

          if not selected and candidates:
              selected = candidates[0]
              versions = model_versions(selected)
              selected_version = versions[-1] if versions else ""

          if not selected or not selected_version:
              raise SystemExit("No usable Firebase Test Lab Android model/version found. See models.json artifact.")

          summary = Path("test-results/firebase-test-lab/selected-device.txt")
          summary.write_text(
              f"model={model_id(selected)}\n"
              f"version={selected_version}\n"
              f"form={model_form(selected)}\n"
              f"name={selected.get('name', '')}\n",
              encoding="utf-8",
          )

          github_env = Path(os.environ["GITHUB_ENV"])
          with github_env.open("a", encoding="utf-8") as env_file:
              env_file.write(f"FTL_MODEL={model_id(selected)}\n")
              env_file.write(f"FTL_VERSION={selected_version}\n")

          print(summary.read_text(encoding="utf-8"))
          PY

      - name: Run Firebase Test Lab Robo test
        env:
          FIREBASE_TEST_LAB_PROJECT_ID: ${{ secrets.FIREBASE_TEST_LAB_PROJECT_ID }}
        run: |
          mkdir -p test-results/firebase-test-lab
          echo "commit=$GITHUB_SHA" > test-results/firebase-test-lab/summary.txt
          echo "apk=$APK_PATH" >> test-results/firebase-test-lab/summary.txt
          echo "device=$FTL_MODEL, Android $FTL_VERSION, ru, portrait" >> test-results/firebase-test-lab/summary.txt
          echo "timeout=120s" >> test-results/firebase-test-lab/summary.txt
          gcloud --quiet config set project "$FIREBASE_TEST_LAB_PROJECT_ID"
          set +e
          gcloud --quiet firebase test android run \
            --type robo \
            --app "$APK_PATH" \
            --device model="$FTL_MODEL",version="$FTL_VERSION",locale=ru,orientation=portrait \
            --timeout 120s \
            --client-details matrixLabel="AI Radar Robo ${GITHUB_SHA::7}" \
            --verbosity=info 2>&1 | tee test-results/firebase-test-lab/gcloud-output.log
          TEST_STATUS=${PIPESTATUS[0]}
          echo "exit_code=$TEST_STATUS" >> test-results/firebase-test-lab/summary.txt
          exit "$TEST_STATUS"

      - name: Upload Firebase Test Lab result logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-test-lab-robo-results
          path: test-results/firebase-test-lab
          if-no-files-found: warn
