name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Check project structure
        run: |
          test -f build.gradle.kts
          test -f settings.gradle.kts
          test -f src/main/AndroidManifest.xml

      - name: Run unit tests
        run: gradle -Pandroid.useAndroidX=true -Pandroid.nonTransitiveRClass=true testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -Pandroid.useAndroidX=true -Pandroid.nonTransitiveRClass=true assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-radar-debug-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
